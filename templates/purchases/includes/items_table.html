<div class="table-responsive">
    <table class="table table-striped table-hover dt-responsive nowrap" style="width:100%" id="details-table">
        <thead>
            <th>Producto</th> 
            <th>Cant.</th>
            <th>Precio</th>
            <th>Sub Total</th>
            <th>Desc.</th>
            <th>IVA</th>
            <th>Total</th>
            <th class="all">Acciones</th>
        </thead>
        <tbody>
            {% for item in purchase_items %}
            <tr id="item-{{ item.id }}">
                <td>{{ item.product.name }}</td>
                <td>{{ item.quantity }}</td>
                <td>${{ item.unit_price }}</td>
                <td>${{ item.subtotal }}</td> 
                <td>${{ item.discount }}</td>
                <td>${{ item.tax }}</td>
                <td>${{ item.total_price }}</td>
                <td>
                    <button type="button" 
                            class="btn btn-danger btn-circle btn-sm" 
                            onclick="deleteItem({{ item.id }}, {% if header %}{{ header.id }}{% else %}0{% endif %}, event)"
                            title="Eliminar item">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
